<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antimo's Affogato - Mobile App</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ==========================================================================
       ANTIMO'S AFFOGATO - OFFICIAL INSTAGRAM & MAJOLICA STYLE GUIDE
       Palette: Mediterranean Blue, Citrus Orange, Ceramic White, Warm Sand
       ========================================================================== */
    :root {
      --majolica-blue: #1A365D;     /* Deep Coastal Navy Blue */
      --majolica-dark: #0F2038;     /* Darker Slate Navy */
      --terracotta: #D96B43;        /* Warm Citrus Orange */
      --terracotta-hover: #C55A32;  /* Sunbaked Orange */
      --cream-bg: #FAF6F0;          /* Warm Mediterranean Cream Canvas */
      --sand-card: #F2ECE1;         /* Majolica Tile Cream Background */
      --sand-border: #E5DCCE;       /* Soft Ceramic Border */
      --espresso-text: #212529;     /* Deep Charcoal Text */
      --gold-star: #F4A261;         /* Warm Gold Star */
      --success-green: #2A9D8F;     /* Olive Green Success */
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --shadow-soft: 0 4px 20px rgba(26, 54, 93, 0.08);
      --shadow-elevated: 0 8px 30px rgba(26, 54, 93, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b1320;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--espresso-text);
      padding: 10px;
    }

    /* Mobile Device Outer Wrapper Mockup */
    .app-viewport {
      width: 100%;
      max-width: 420px;
      height: 880px;
      max-height: 94vh;
      background: var(--cream-bg);
      border-radius: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 12px #19273c;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Vicinity Toggle Header Bar */
    .vicinity-bar {
      background: var(--majolica-dark);
      color: #fff;
      padding: 10px 16px;
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .vicinity-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .vicinity-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success-green);
      box-shadow: 0 0 8px var(--success-green);
    }

    .vicinity-dot.off {
      background: var(--terracotta);
      box-shadow: 0 0 8px var(--terracotta);
    }

    .sim-toggle-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .sim-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Main Navigation Header */
    .app-header {
      background: var(--majolica-blue);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-soft);
      position: relative;
      z-index: 40;
      border-bottom: 3px solid var(--terracotta);
    }

    .brand-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Instagram Profile Logo Circle Match */
    .brand-logo-icon {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--majolica-blue);
      font-weight: 900;
      font-size: 1.15rem;
      border: 2px solid var(--terracotta);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #fff;
    }

    .brand-subtitle {
      font-size: 0.68rem;
      color: var(--terracotta);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .badge-count {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--terracotta);
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--majolica-blue);
    }

    /* Content Area Scrollable Body */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      position: relative;
      padding-bottom: 90px;
    }

    /* Scrollbar Styling */
    .app-content::-webkit-scrollbar {
      width: 4px;
    }
    .app-content::-webkit-scrollbar-thumb {
      background: var(--sand-border);
      border-radius: 4px;
    }

    /* Cards & Components */
    .majolica-card {
      background: var(--sand-card);
      border: 1px solid var(--sand-border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .majolica-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--majolica-blue), var(--terracotta));
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--majolica-blue);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-heading {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--majolica-blue);
      margin: 16px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Menu Items Grid & List */
    .menu-category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }

    .menu-tab {
      background: var(--sand-card);
      border: 1px solid var(--sand-border);
      color: var(--espresso-text);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-tab.active {
      background: var(--majolica-blue);
      color: #fff;
      border-color: var(--majolica-blue);
    }

    .menu-item-card {
      background: #fff;
      border: 1px solid var(--sand-border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .item-img-placeholder {
      width: 70px;
      height: 70px;
      background: var(--sand-card);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--terracotta);
      font-weight: bold;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
    }

    .item-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--majolica-blue);
      margin-bottom: 2px;
    }

    .item-desc {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .item-price {
      font-weight: 800;
      color: var(--terracotta);
      font-size: 0.9rem;
    }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      transition: color 0.2s;
    }

    .fav-btn.active {
      color: #e63946;
    }

    .add-btn {
      background: var(--majolica-blue);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }

    .add-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .add-btn:not(:disabled):hover {
      background: var(--terracotta);
    }

    /* Buttons */
    .btn-primary {
      background: var(--terracotta);
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(217, 107, 67, 0.3);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--terracotta-hover);
    }

    .btn-secondary {
      background: var(--majolica-blue);
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Navigation Drawer Overlay */
    .drawer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-menu {
      width: 280px;
      height: 100%;
      background: var(--cream-bg);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      box-shadow: -5px 0 25px rgba(0,0,0,0.2);
    }

    .drawer-overlay.open .drawer-menu {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--sand-border);
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius-sm);
      color: var(--majolica-blue);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .drawer-item:hover {
      background: var(--sand-card);
    }

    /* Bottom Tab Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: #fff;
      border-top: 1px solid var(--sand-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 40;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: #888;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      width: 20%;
      padding: 8px 0;
      transition: color 0.2s;
    }

    .nav-tab.active {
      color: var(--terracotta);
    }

    /* Interactive Live Status Stepper */
    .status-stepper {
      display: flex;
      justify-content: space-between;
      margin: 16px 0;
      position: relative;
    }

    .status-stepper::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: #e0e0e0;
      z-index: 1;
    }

    .step-node {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-icon-bubble {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #777;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .step-node.completed .step-icon-bubble,
    .step-node.active .step-icon-bubble {
      background: var(--terracotta);
      color: #fff;
    }

    .step-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: #666;
    }

    /* Stamp Rewards Tracker */
    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 14px 0;
    }

    .stamp-slot {
      aspect-ratio: 1;
      background: #fff;
      border: 2px dashed var(--sand-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 0.8rem;
    }

    .stamp-slot.earned {
      border-style: solid;
      border-color: var(--terracotta);
      background: var(--sand-card);
      color: var(--terracotta);
    }

    /* Map Mockup */
    .map-container {
      width: 100%;
      height: 180px;
      background: #d4e0e9;
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--sand-border);
    }

    .map-grid-lines {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--majolica-blue) 1px, transparent 1px);
      background-size: 16px 16px;
      opacity: 0.15;
    }

    .truck-pin {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      z-index: 10;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pin-bubble {
      background: var(--terracotta);
      color: #fff;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* Modal Sheet Overlay */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 90;
      display: flex;
      align-items: flex-end;
    }

    .modal-sheet {
      background: var(--cream-bg);
      width: 100%;
      max-height: 85%;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--majolica-blue);
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--sand-border);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      background: #fff;
    }

    .badge-pill {
      background: var(--majolica-blue);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // MENU DATA (Antimo's Affogato Exact Items & Pricing)
    // ==========================================
    const MENU_DATA = [
      {
        id: 'aff-classico',
        category: 'Affogatos',
        name: 'Affogato Classico',
        price: 8.00,
        desc: 'Single scoop of artisanal Fior di Latte drowned in a fresh hot double shot of espresso.',
        icon: '☕'
      },
      {
        id: 'aff-doppio',
        category: 'Affogatos',
        name: 'Affogato Doppio',
        price: 10.00,
        desc: 'Double scoop of gelato with double espresso shot & dusted cocoa powder.',
        icon: '🍨'
      },
      {
        id: 'gel-single',
        category: 'Artisanal Gelato',
        name: 'Single Scoop Gelato',
        price: 5.50,
        desc: 'Choice of Fior di Latte, Nocciola, Cioccolato Scuro, or Pistacchio.',
        icon: '🍧'
      },
      {
        id: 'gel-double',
        category: 'Artisanal Gelato',
        name: 'Double Scoop Gelato',
        price: 7.50,
        desc: 'Two handcrafted scoops served in an artisanal cup or waffle cone.',
        icon: '🍦'
      },
      {
        id: 'soda-craft',
        category: 'Italian Sodas',
        name: 'Craft Italian Soda',
        price: 5.50,
        desc: 'Sparkling soda in Blood Orange, Wild Raspberry, Sicilian Lemon, White Peach, or Amarena Cherry.',
        icon: '🥤'
      },
      {
        id: 'float-dolce',
        category: 'Italian Sodas',
        name: 'Dolce Fizz Float',
        price: 8.50,
        desc: 'Artisanal Fior di Latte gelato floated atop signature sparkling Italian soda.',
        icon: '🍹'
      },
      {
        id: 'esp-double',
        category: 'Espresso Bar',
        name: 'Double Espresso',
        price: 4.00,
        desc: 'Rich, concentrated double shot roasted custom for affogato pairings.',
        icon: '☕'
      },
      {
        id: 'esp-cappuccino',
        category: 'Espresso Bar',
        name: 'Cappuccino',
        price: 5.50,
        desc: 'Equal parts espresso, steamed milk, and velvety foam microfoam.',
        icon: '🥛'
      },
      {
        id: 'esp-latte',
        category: 'Espresso Bar',
        name: 'Caffè Latte',
        price: 6.50,
        desc: 'Smooth double shot espresso with silky steamed milk base.',
        icon: '☕'
      }
    ];

    const FAQ_DATA = [
      { q: 'Where does the truck park?', a: 'We operate across Nassau & Suffolk counties on Long Island, including Long Beach boardwalk and Farmingdale events!' },
      { q: 'How close do I need to be to order online?', a: 'Online pre-ordering unlocks automatically when your GPS is within 0.1 miles of our truck window.' },
      { q: 'How do catering quote calculations work?', a: 'Our private event estimator factors in your guest count, hours of service, and gelato selection.' },
      { q: 'Can I track my loyalty points?', a: 'Yes! Earn 1 stamp for every affogato purchased. 8 stamps = 1 free Affogato Classico!' }
    ];

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // Vicinity State (Simulated 0.1 miles radius)
      const [userDistance, setUserDistance] = useState(0.04); // miles
      const isWithinVicinity = userDistance <= 0.1;

      // App Navigation & Drawer State
      const [activeTab, setActiveTab] = useState('home'); // home, menu, map, rewards, account
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [modalView, setModalView] = useState(null); // cart, catering, review, story, faq, contact, auth

      // User Account State
      const [user, setUser] = useState({
        name: 'Julia Pace',
        email: 'julia.pace@example.com',
        stamps: 5,
        points: 120
      });

      // Cart & Favorites State
      const [cart, setCart] = useState([]);
      const [favorites, setFavorites] = useState(['aff-classico', 'soda-craft']);
      const [activeOrder, setActiveOrder] = useState({
        id: 'ANT-9821',
        status: 'Preparing',
        items: [
          { name: 'Affogato Classico', qty: 1, price: 8.00 },
          { name: 'Craft Italian Soda (Blood Orange)', qty: 1, price: 5.50 }
        ],
        total: 13.50
      });

      // Catering Calculator State
      const [catering, setCatering] = useState({
        guests: 50,
        hours: 2,
        package: 'Standard'
      });

      // Filtered Menu Category
      const [selectedCategory, setSelectedCategory] = useState('All');

      // Sync Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Toggle Favorites
      const toggleFavorite = (id) => {
        if (favorites.includes(id)) {
          setFavorites(favorites.filter(favId => favId !== id));
        } else {
          setFavorites([...favorites, id]);
        }
      };

      // Cart Actions
      const addToCart = (item) => {
        const existing = cart.find(c => c.id === item.id);
        if (existing) {
          setCart(cart.map(c => c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
        } else {
          setCart([...cart, { ...item, qty: 1 }]);
        }
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      // Estimated Catering Price
      const cateringPrice = (catering.guests * 8.5) + (catering.hours * 75);

      return (
        <div className="app-viewport">
          
          {/* TOP VICINITY GPS TRACKER HEADER */}
          <div className="vicinity-bar">
            <div className="vicinity-badge">
              <span className={`vicinity-dot ${isWithinVicinity ? '' : 'off'}`}></span>
              <span>Truck Vicinity: <strong>{userDistance} mi</strong></span>
            </div>
            <button 
              className="sim-toggle-btn"
              onClick={() => setUserDistance(isWithinVicinity ? 0.45 : 0.04)}
            >
              {isWithinVicinity ? 'Simulate Outside (0.45mi)' : 'Simulate Near (0.04mi)'}
            </button>
          </div>

          {/* MAIN BRAND HEADER (MATCHING INSTAGRAM LOGO & STYLE) */}
          <header className="app-header">
            <div className="brand-title-group">
              {/* Exact Logo Monogram from Instagram Profile */}
              <div className="brand-logo-icon">AA</div>
              <div>
                <div className="brand-name">Antimo's Affogato</div>
                <div className="brand-subtitle">Mobile Espresso, Gelato & Soda Bar</div>
              </div>
            </div>
            <div className="header-actions">
              <button className="icon-btn" onClick={() => setModalView('cart')}>
                <i data-lucide="shopping-bag" style={{width: 18, height: 18}}></i>
                {cart.length > 0 && <span className="badge-count">{cart.reduce((a,b)=>a+b.qty,0)}</span>}
              </button>
              <button className="icon-btn" onClick={() => setDrawerOpen(true)}>
                <i data-lucide="menu" style={{width: 18, height: 18}}></i>
              </button>
            </div>
          </header>

          {/* APP SCROLLABLE CONTENT BODY */}
          <main className="app-content">

            {/* TAB: HOME */}
            {activeTab === 'home' && (
              <div>
                {/* Active Order Banner if Available */}
                {activeOrder && (
                  <div className="majolica-card" style={{background: '#fff'}}>
                    <div className="card-title">
                      <span>Live Order Status</span>
                      <span className="badge-pill">{activeOrder.id}</span>
                    </div>
                    <p style={{fontSize: '0.8rem', color: '#555', marginBottom: 8}}>
                      Truck Window Pickup • Long Beach Boardwalk
                    </p>
                    <div className="status-stepper">
                      <div className="step-node completed">
                        <div className="step-icon-bubble">✓</div>
                        <span className="step-label">Received</span>
                      </div>
                      <div className="step-node active">
                        <div className="step-icon-bubble">☕</div>
                        <span className="step-label">Preparing</span>
                      </div>
                      <div className="step-node">
                        <div className="step-icon-bubble">✨</div>
                        <span className="step-label">Ready</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* Vicinity Ordering Status Box */}
                <div className="majolica-card" style={{textAlign: 'center', background: isWithinVicinity ? 'var(--sand-card)' : '#fff'}}>
                  <div style={{fontSize: '2rem', marginBottom: 6}}>
                    {isWithinVicinity ? '📍' : '🔒'}
                  </div>
                  <h3 style={{color: 'var(--majolica-blue)', fontSize: '1.1rem', marginBottom: 4}}>
                    {isWithinVicinity ? 'You Are At The Truck!' : 'Ordering Locked (Out of Range)'}
                  </h3>
                  <p style={{fontSize: '0.78rem', color: '#666', marginBottom: 12}}>
                    {isWithinVicinity 
                      ? 'You are within 0.1 miles. Express mobile ordering is active!' 
                      : 'Move within 0.1 miles of the truck location to enable online ordering.'}
                  </p>
                  <button 
                    className="btn-primary"
                    disabled={!isWithinVicinity}
                    onClick={() => setActiveTab('menu')}
                    style={{opacity: isWithinVicinity ? 1 : 0.6}}
                  >
                    {isWithinVicinity ? 'Order Fresh Affogato Now' : 'View Menu Options'}
                  </button>
                </div>

                {/* Quick Favorites Section */}
                <div className="section-heading">
                  <i data-lucide="heart" style={{color: 'var(--terracotta)', width: 20}}></i>
                  <span>Your Favorites</span>
                </div>
                {MENU_DATA.filter(m => favorites.includes(m.id)).map(item => (
                  <div className="menu-item-card" key={item.id}>
                    <div className="item-img-placeholder">{item.icon}</div>
                    <div className="item-details">
                      <div className="item-name">{item.name}</div>
                      <div className="item-price">${item.price.toFixed(2)}</div>
                    </div>
                    <button 
                      className="add-btn" 
                      disabled={!isWithinVicinity}
                      onClick={() => addToCart(item)}
                    >
                      + Add
                    </button>
                  </div>
                ))}

                {/* Catering CTA Banner */}
                <div className="majolica-card" style={{background: 'var(--majolica-blue)', color: '#fff', marginTop: 16}}>
                  <h3 style={{fontSize: '1rem', marginBottom: 4, color: '#fff'}}>Private Events & Catering</h3>
                  <p style={{fontSize: '0.78rem', color: '#d0d8e2', marginBottom: 12}}>
                    Book Antimo's Affogato for weddings, corporate gatherings, and private events across Long Island.
                  </p>
                  <button className="btn-primary" onClick={() => setModalView('catering')}>
                    Estimate & Request Quote
                  </button>
                </div>
              </div>
            )}

            {/* TAB: MENU & ORDERING */}
            {activeTab === 'menu' && (
              <div>
                <div className="section-heading">
                  <i data-lucide="coffee" style={{color: 'var(--majolica-blue)', width: 20}}></i>
                  <span>Menu & Ordering</span>
                </div>

                {/* Categories */}
                <div className="menu-category-tabs">
                  {['All', 'Affogatos', 'Artisanal Gelato', 'Italian Sodas', 'Espresso Bar'].map(cat => (
                    <button 
                      key={cat} 
                      className={`menu-tab ${selectedCategory === cat ? 'active' : ''}`}
                      onClick={() => setSelectedCategory(cat)}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                {/* Menu List */}
                {MENU_DATA.filter(i => selectedCategory === 'All' || i.category === selectedCategory).map(item => (
                  <div className="menu-item-card" key={item.id}>
                    <button 
                      className={`fav-btn ${favorites.includes(item.id) ? 'active' : ''}`}
                      onClick={() => toggleFavorite(item.id)}
                    >
                      ♥
                    </button>
                    <div className="item-img-placeholder">{item.icon}</div>
                    <div className="item-details">
                      <div className="item-name">{item.name}</div>
                      <div className="item-desc">{item.desc}</div>
                      <div className="item-price">${item.price.toFixed(2)}</div>
                    </div>
                    <button 
                      className="add-btn" 
                      disabled={!isWithinVicinity}
                      onClick={() => addToCart(item)}
                    >
                      + Add
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TAB: TRUCK MAP LOCATION */}
            {activeTab === 'map' && (
              <div>
                <div className="section-heading">
                  <i data-lucide="map-pin" style={{color: 'var(--terracotta)', width: 20}}></i>
                  <span>Live Truck Location</span>
                </div>

                <div className="map-container">
                  <div className="map-grid-lines"></div>
                  <div className="truck-pin">
                    <div className="pin-bubble">🚚 Antimo's Truck</div>
                    <div style={{width: 12, height: 12, background: 'var(--majolica-blue)', borderRadius: '50%', border: '2px solid #fff'}}></div>
                  </div>
                </div>

                <div className="majolica-card">
                  <div className="card-title">
                    <span>Current Serving Location</span>
                    <span className="badge-pill">OPEN NOW</span>
                  </div>
                  <p style={{fontWeight: 700, color: 'var(--majolica-blue)', fontSize: '0.9rem'}}>
                    Long Beach Boardwalk & Riverside Blvd
                  </p>
                  <p style={{fontSize: '0.78rem', color: '#666', marginTop: 4}}>
                    Serving until 8:00 PM today • Long Island, NY
                  </p>
                </div>

                <div className="majolica-card">
                  <div className="card-title">Weekly Schedule</div>
                  <ul style={{fontSize: '0.78rem', color: '#444', listStyle: 'none', lineHeight: 2}}>
                    <li><strong>Mon - Wed:</strong> Private Events & Prep</li>
                    <li><strong>Thu - Fri:</strong> Farmingdale Tech Park (11am - 4pm)</li>
                    <li><strong>Sat - Sun:</strong> Long Beach Boardwalk (10am - 8pm)</li>
                  </ul>
                </div>
              </div>
            )}

            {/* TAB: REWARDS */}
            {activeTab === 'rewards' && (
              <div>
                <div className="section-heading">
                  <i data-lucide="award" style={{color: 'var(--terracotta)', width: 20}}></i>
                  <span>Loyalty & Stamp Card</span>
                </div>

                <div className="majolica-card" style={{background: 'var(--majolica-blue)', color: '#fff', textAlign: 'center'}}>
                  <div style={{fontSize: '0.8rem', opacity: 0.8}}>Antimo's Affogato Rewards</div>
                  <div style={{fontSize: '2rem', fontWeight: 800, margin: '6px 0', color: 'var(--terracotta)'}}>
                    {user.stamps} / 8 STAMPS
                  </div>
                  <p style={{fontSize: '0.75rem', opacity: 0.9}}>
                    Earn 1 stamp per affogato purchase. 3 more stamps until your FREE Affogato Classico!
                  </p>
                </div>

                <div className="majolica-card">
                  <div className="card-title">Digital Stamp Card</div>
                  <div className="stamps-grid">
                    {[1, 2, 3, 4, 5, 6, 7, 8].map(slot => (
                      <div key={slot} className={`stamp-slot ${slot <= user.stamps ? 'earned' : ''}`}>
                        {slot <= user.stamps ? '☕' : slot}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: ACCOUNT */}
            {activeTab === 'account' && (
              <div>
                <div className="section-heading">
                  <i data-lucide="user" style={{color: 'var(--majolica-blue)', width: 20}}></i>
                  <span>Account Profile</span>
                </div>

                <div className="majolica-card">
                  <div style={{display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12}}>
                    <div style={{width: 46, height: 46, background: 'var(--majolica-blue)', color: '#fff', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '1.2rem'}}>
                      JP
                    </div>
                    <div>
                      <div style={{fontWeight: 800, fontSize: '1rem', color: 'var(--majolica-blue)'}}>{user.name}</div>
                      <div style={{fontSize: '0.75rem', color: '#666'}}>{user.email}</div>
                    </div>
                  </div>
                  <button className="btn-secondary" style={{fontSize: '0.75rem', padding: '6px 10px'}} onClick={() => setModalView('auth')}>
                    Switch Account / Logout
                  </button>
                </div>

                <div className="majolica-card">
                  <div className="card-title">Saved Payment Methods</div>
                  <div style={{fontSize: '0.8rem', color: '#555', display: 'flex', alignItems: 'center', gap: 8}}>
                    <span>💳 Visa ending in **4921</span>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* BOTTOM FIXED NAVIGATION BAR */}
          <nav className="bottom-nav">
            <button className={`nav-tab ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>
              <i data-lucide="home" style={{width: 18, height: 18}}></i>
              <span>Home</span>
            </button>
            <button className={`nav-tab ${activeTab === 'menu' ? 'active' : ''}`} onClick={() => setActiveTab('menu')}>
              <i data-lucide="coffee" style={{width: 18, height: 18}}></i>
              <span>Menu</span>
            </button>
            <button className={`nav-tab ${activeTab === 'map' ? 'active' : ''}`} onClick={() => setActiveTab('map')}>
              <i data-lucide="map-pin" style={{width: 18, height: 18}}></i>
              <span>Truck Map</span>
            </button>
            <button className={`nav-tab ${activeTab === 'rewards' ? 'active' : ''}`} onClick={() => setActiveTab('rewards')}>
              <i data-lucide="award" style={{width: 18, height: 18}}></i>
              <span>Rewards</span>
            </button>
            <button className={`nav-tab ${activeTab === 'account' ? 'active' : ''}`} onClick={() => setActiveTab('account')}>
              <i data-lucide="user" style={{width: 18, height: 18}}></i>
              <span>Account</span>
            </button>
          </nav>

          {/* SLIDE-OUT DRAWER MENU OVERLAY */}
          <div className={`drawer-overlay ${drawerOpen ? 'open' : ''}`} onClick={() => setDrawerOpen(false)}>
            <div className="drawer-menu" onClick={e => e.stopPropagation()}>
              <div className="drawer-header">
                <span style={{fontWeight: 800, color: 'var(--majolica-blue)'}}>Navigation</span>
                <button style={{background: 'none', border: 'none', cursor: 'pointer'}} onClick={() => setDrawerOpen(false)}>✕</button>
              </div>

              <div className="drawer-item" onClick={() => { setModalView('story'); setDrawerOpen(false); }}>
                <i data-lucide="book-open" style={{width: 18}}></i>
                <span>Our Story</span>
              </div>
              <div className="drawer-item" onClick={() => { setModalView('catering'); setDrawerOpen(false); }}>
                <i data-lucide="calendar" style={{width: 18}}></i>
                <span>Private Event Catering</span>
              </div>
              <div className="drawer-item" onClick={() => { setModalView('review'); setDrawerOpen(false); }}>
                <i data-lucide="star" style={{width: 18}}></i>
                <span>Write a Review</span>
              </div>
              <div className="drawer-item" onClick={() => { setModalView('faq'); setDrawerOpen(false); }}>
                <i data-lucide="help-circle" style={{width: 18}}></i>
                <span>FAQ</span>
              </div>
              <div className="drawer-item" onClick={() => { setModalView('contact'); setDrawerOpen(false); }}>
                <i data-lucide="mail" style={{width: 18}}></i>
                <span>Contact Us</span>
              </div>
            </div>
          </div>

          {/* MODAL BOTTOM SHEETS */}
          {modalView && (
            <div className="modal-overlay" onClick={() => setModalView(null)}>
              <div className="modal-sheet" onClick={e => e.stopPropagation()}>
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16}}>
                  <h3 style={{color: 'var(--majolica-blue)', fontWeight: 800}}>
                    {modalView === 'cart' && 'Your Cart'}
                    {modalView === 'catering' && 'Catering & Event Quote'}
                    {modalView === 'story' && 'Our Story'}
                    {modalView === 'review' && 'Leave a Review'}
                    {modalView === 'faq' && 'Frequently Asked Questions'}
                    {modalView === 'contact' && 'Contact Us'}
                    {modalView === 'auth' && 'Account Settings'}
                  </h3>
                  <button style={{background: 'none', border: 'none', cursor: 'pointer', fontWeight: 'bold'}} onClick={() => setModalView(null)}>✕</button>
                </div>

                {/* CART MODAL */}
                {modalView === 'cart' && (
                  <div>
                    {cart.length === 0 ? (
                      <p style={{fontSize: '0.85rem', color: '#666', textAlign: 'center', padding: '20px 0'}}>Your cart is empty.</p>
                    ) : (
                      <div>
                        {cart.map(i => (
                          <div key={i.id} style={{display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid #eee', fontSize: '0.85rem'}}>
                            <span>{i.qty}x {i.name}</span>
                            <strong>${(i.price * i.qty).toFixed(2)}</strong>
                          </div>
                        ))}
                        <div style={{marginTop: 16, paddingTop: 12, borderTop: '2px solid var(--majolica-blue)', display: 'flex', justifyContent: 'space-between', fontWeight: 800}}>
                          <span>Total</span>
                          <span style={{color: 'var(--terracotta)'}}>${cartTotal.toFixed(2)}</span>
                        </div>
                        <button 
                          className="btn-primary" 
                          style={{marginTop: 16}}
                          onClick={() => {
                            alert('Order submitted successfully to Antimo\'s Affogato truck queue!');
                            setCart([]);
                            setModalView(null);
                          }}
                        >
                          Checkout & Pay
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* CATERING MODAL */}
                {modalView === 'catering' && (
                  <div>
                    <div className="form-group">
                      <label>Estimated Guests</label>
                      <input 
                        type="number" 
                        className="form-control" 
                        value={catering.guests}
                        onChange={e => setCatering({...catering, guests: parseInt(e.target.value) || 0})}
                      />
                    </div>
                    <div className="form-group">
                      <label>Hours of Service</label>
                      <input 
                        type="number" 
                        className="form-control" 
                        value={catering.hours}
                        onChange={e => setCatering({...catering, hours: parseInt(e.target.value) || 0})}
                      />
                    </div>
                    <div className="majolica-card" style={{textAlign: 'center', marginTop: 12}}>
                      <div style={{fontSize: '0.75rem', color: '#666'}}>Estimated Catering Total</div>
                      <div style={{fontSize: '1.6rem', fontWeight: 800, color: 'var(--terracotta)'}}>
                        ${cateringPrice.toFixed(2)}
                      </div>
                    </div>
                    <button className="btn-primary" onClick={() => { alert('Catering inquiry submitted!'); setModalView(null); }}>
                      Submit Quote Request
                    </button>
                  </div>
                )}

                {/* STORY MODAL */}
                {modalView === 'story' && (
                  <div style={{fontSize: '0.82rem', lineHeight: 1.6, color: '#444'}}>
                    <p style={{marginBottom: 10}}>
                      <strong>Antimo’s Affogato</strong> operates under Fiorire LLC, bringing authentic Italian gelato and rich roasted espresso to Long Island, NY.
                    </p>
                    <p>
                      Inspired by Mediterranean coastal aesthetics and classic blue Majolica tile artistry, we handcrafted our truck experience to bring artisanal indulgence straight to beachside boardwalks and private events.
                    </p>
                  </div>
                )}

                {/* FAQ MODAL */}
                {modalView === 'faq' && (
                  <div>
                    {FAQ_DATA.map((item, idx) => (
                      <div key={idx} style={{marginBottom: 12, paddingBottom: 8, borderBottom: '1px solid #eee'}}>
                        <div style={{fontWeight: 700, color: 'var(--majolica-blue)', fontSize: '0.85rem'}}>{item.q}</div>
                        <div style={{fontSize: '0.78rem', color: '#666', marginTop: 4}}>{item.a}</div>
                      </div>
                    ))}
                  </div>
                )}

                {/* CONTACT MODAL */}
                {modalView === 'contact' && (
                  <div>
                    <div className="form-group"><label>Name</label><input className="form-control" placeholder="Julia Pace" /></div>
                    <div className="form-group"><label>Email</label><input className="form-control" placeholder="julia@example.com" /></div>
                    <div className="form-group"><label>Message</label><textarea className="form-control" rows="3" placeholder="How can we help?"></textarea></div>
                    <button className="btn-primary" onClick={() => { alert('Message sent!'); setModalView(null); }}>Send Message</button>
                  </div>
                )}

                {/* REVIEW MODAL */}
                {modalView === 'review' && (
                  <div>
                    <div style={{textAlign: 'center', fontSize: '1.5rem', marginBottom: 12, color: 'var(--gold-star)'}}>★ ★ ★ ★ ★</div>
                    <div className="form-group"><label>Your Review</label><textarea className="form-control" rows="3" placeholder="Tell us about your affogato experience..."></textarea></div>
                    <button className="btn-primary" onClick={() => { alert('Thank you for your review!'); setModalView(null); }}>Submit Review</button>
                  </div>
                )}

                {/* AUTH MODAL */}
                {modalView === 'auth' && (
                  <div>
                    <p style={{fontSize: '0.8rem', color: '#666', marginBottom: 12}}>Logged in as <strong>{user.email}</strong></p>
                    <button className="btn-secondary" onClick={() => { setUser({ name: 'Guest User', email: 'guest@example.com', stamps: 0, points: 0 }); setModalView(null); }}>
                      Log Out
                    </button>
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
